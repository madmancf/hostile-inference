name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    name: Source / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run check:public
      - run: npm test
  browser:
    name: Background account flow
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Allow the bundled browser to create its sandbox
        # Ubuntu restricts user namespaces for downloaded browser binaries.
        # Grant only this executable access, on this disposable runner; keep
        # Chromium's sandbox and the host-wide AppArmor restriction enabled.
        run: |
          browser_path="$(node --input-type=module -e 'import {chromium} from "playwright"; process.stdout.write(chromium.executablePath())')"
          test -x "$browser_path"
          printf 'HI_BROWSER_EXECUTABLE=%s\n' "$browser_path" >> "$GITHUB_ENV"
          sudo tee /etc/apparmor.d/hostile-inference-chromium >/dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile hostile-inference-chromium "$browser_path" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/hostile-inference-chromium
      - run: npm run check:assets
      - run: npm run test:browser
        env:
          HI_BROWSER_GAME: "1"
          HI_BROWSER_SOFTWARE_GPU: "1"
