<!doctype html><html lang="en"><meta charset="utf-8"><title>Hostile Inference — Local asset verification</title><style>body{margin:0;background:#20372e;color:#fff8e9;font:17px Arial}header{display:flex;align-items:center;gap:15px;padding:16px;flex-wrap:wrap}button,select{font:17px Arial;padding:10px;background:#f3eedf;border:0;color:#20372e}main{width:1440px;height:900px;position:relative;max-width:100vw}canvas{width:100%;height:100%;display:block}#status{position:absolute;left:18px;top:16px;background:#20372ee8;padding:12px;max-width:800px}pre{font-size:14px;white-space:pre-wrap}p{margin:0 0 5px}</style><header><b>LOCAL ART VERIFICATION</b><select id="view"><option value="field">Moving field team / combat</option><option value="researcher">Researcher / closest zoom</option><option value="agent">Agent / closest zoom</option><option value="hq">Headquarters / closest zoom</option></select><select id="faction"><option value="misanthropic">Misanthropic</option><option value="closed">Closed AI</option><option value="broke">Broke Labs</option></select><label>Unit zoom <input id="detail-zoom" type="range" min="1.2" max="3.2" step=".05" value="3.2"></label><button id="play">Play workload</button><button id="reset">Equivalent frame / 8s</button><button id="benchmark">Run 12-second sample</button><a style="color:inherit" href="../demo/index.html?tutorial=1">Guided mission ↗</a></header><main><canvas id="comparison"></canvas><div id="status">Loading existing assets…</div></main><script type="module">
const reference=new URL(location.href).searchParams.get('renderer')==='reference';const {LiveWorld}=await import(reference?'../servers/live-world-reference-v0.5.js':'../servers/live-world.js');import {createGame,spawn,tickGame,command,point,ROLES} from '../demo/engine.js';
const canvas=document.querySelector('canvas'),live=new LiveWorld(canvas),status=document.querySelector('#status');let game,camera,playing=false,view='field',owner='misanthropic',clock=0,last=0,lastDraw=0,nextDrawAt=0,acc=0,frames=[],cpu=[],sample=null;
function fixture(){const g=createGame(owner,'relaxed');g.preview=true;g.nextWave=Infinity;g.units=g.units.filter(u=>u.team==='player');g.funds=3000;g.capacity=62;for(const r of ['model','firewall','agent','malware','cloud'])spawn(g,r);for(const u of g.units){if(u.role==='researcher')command(g,[u.id],'research','lab');else if(u.role==='harvester')command(g,[u.id],'harvest','grid');else if(['cooler','cloud'].includes(u.role))command(g,[u.id],'cool','intake');else command(g,[u.id],'move','gate');}const gate=point('gate',owner),enemy=g.enemies[0];for(const r of ['agent','malware','model']){const u=spawn(g,r,enemy,'gate',owner);u.order='hold';u.x=gate.x+85+u.rank*30;}return g;}
function focus(){if(view==='field'){const q=point('gate',owner);camera={x:q.x+220,y:q.y,zoom:1.25};}else if(view==='hq'){const p=point('campus',owner);camera={x:p.x,y:p.y-160,zoom:3.2};}else{const u=game.units.find(u=>u.team==='player'&&u.role===view);camera={x:u.x,y:u.y,zoom:Number(document.querySelector('#detail-zoom').value)};}}
function info(){const graphics=live.stats();status.textContent=`${graphics.assetProfile.toUpperCase()} · ${owner} · ${view} · ${clock.toFixed(1)}s · ${canvas.dataset.fps||'—'} FPS · ${graphics.triangles.toLocaleString()} submitted triangles · ${graphics.fieldLODActors} field LOD actors`;window.assetQA={rendererVersion:reference?'v0.5-reference':'candidate',profile:graphics.assetProfile,view,owner,time:clock,graphics,frameCPU:cpu.slice(-1200),sample:sample?.result||null,fps:frames.length/frames.reduce((n,v)=>n+v,0),canvas:[canvas.width,canvas.height],units:game.units.map(u=>({id:u.id,role:u.role,team:u.team,x:u.x,y:u.y,hp:u.hp,moving:u.moving})),network:performance.getEntriesByType('resource').filter(r=>r.name.includes('.glb')).map(r=>({name:r.name.split('/').pop(),bytes:r.encodedBodySize}))};}
function draw(){if(view==='agent'||view==='researcher')focus();const t=performance.now();live.render(game,camera,new Set(),clock);cpu.push(performance.now()-t);if(cpu.length>1200)cpu.shift();if(sample&&!sample.result){sample.frames.push({cpuMs:cpu.at(-1),stages:live.stats().profile,timings:live.stats().timings,programs:live.stats().programCount,triangles:live.stats().triangles,lod:live.stats().fieldLODActors,dt:frames.at(-1),wallOffsetMs:performance.now()-sample.started});if(clock>=20){playing=false;document.querySelector("#play").textContent="Play workload";sample.result={wallSeconds:(performance.now()-sample.started)/1000,simulationSeconds:clock-8,frames:sample.frames};}}info();}
function reset(){playing=false;sample=null;document.querySelector('#play').textContent='Play workload';game=fixture();if(view==='researcher'||view==='agent'){game.units=game.units.filter(u=>u.team==='player');const u=game.units.find(u=>u.role===view);command(game,[u.id],'move','campus');}for(let i=0;i<160;i++)tickGame(game,.05);clock=8;focus();live.render(game,camera,new Set(),8);for(let t=0;t<=8;t+=.05)for(const u of game.units){const a=live.actors.get(u.id);if(a)for(const f of a.anim)f(t,{...u,animDistance:u.animDistance});}frames=[];cpu=[];acc=0;draw();lastDraw=nextDrawAt=performance.now();}
await live.ready;const box=canvas.getBoundingClientRect();live.resize(box.width,box.height);reset();document.querySelector('#detail-zoom').oninput=()=>{if(view==='researcher'||view==='agent')draw();};document.querySelector('#view').onchange=e=>{view=e.target.value;reset();};document.querySelector('#faction').onchange=e=>{owner=e.target.value;reset();};document.querySelector('#reset').onclick=reset;document.querySelector('#benchmark').onclick=()=>{reset();sample={started:performance.now(),frames:[]};playing=true;last=lastDraw=nextDrawAt=performance.now();document.querySelector('#play').textContent='Pause workload';};document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'Pause workload':'Play workload';last=performance.now();frames=[];cpu=[];};
function frame(now){const wallDelta=Math.max(0,(now-(last||now))/1000),dt=Math.min(.1,wallDelta);last=now;if(playing&&!document.hidden){clock+=dt;acc+=dt;while(acc>=.05){tickGame(game,.05);acc-=.05;}if(now+.5>=nextDrawAt&&(!live.canRenderFrame||live.canRenderFrame())){frames.push(Math.max(0,(now-lastDraw)/1000));if(frames.length>300)frames.shift();canvas.dataset.fps=String(Math.round(frames.length/frames.reduce((n,v)=>n+v,0)));draw();lastDraw=now;nextDrawAt=now+1000/48-Math.max(0,now-nextDrawAt)%(1000/48);}}requestAnimationFrame(frame);}requestAnimationFrame(frame);window.addEventListener('beforeunload',()=>live.dispose());
</script></html>
